<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F2F8F7" />
    <title>Tovább — nincs kapcsolat</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(640px 460px at 94% 0, rgba(0, 255, 204, 0.5), rgba(0, 255, 204, 0) 70%),
          radial-gradient(520px 400px at 0 100%, rgba(107, 78, 255, 0.14), rgba(107, 78, 255, 0) 70%),
          #f2f8f7;
        color: #0e1f1c;
        font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        width: min(34rem, calc(100% - 2rem));
        margin: 14vh auto 0;
        padding: 1.75rem;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 1.4rem;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 1px 2px rgba(14, 31, 28, 0.04), 0 8px 30px rgba(14, 31, 28, 0.07);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        backdrop-filter: blur(22px) saturate(160%);
      }
      svg { display: block; margin-bottom: 1.25rem; }
      h1 { margin: 0 0 0.6rem; font-size: clamp(1.9rem, 7vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
      p { margin: 0.45rem 0 0; color: #44524e; }
      button {
        margin-top: 1.5rem;
        height: 3.1rem;
        padding: 0 1.3rem;
        border: 0;
        border-radius: 999px;
        background: #0e1f1c;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #00876c; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true">
        <rect width="32" height="32" rx="9.5" fill="#0E1F1C" />
        <circle cx="9.6" cy="16" r="2.3" fill="none" stroke="#00FFCC" stroke-width="2" />
        <path d="M14.6 16h9.4M20.2 11.4 24.8 16l-4.6 4.6" fill="none" stroke="#00FFCC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>Most nincs kapcsolat.</h1>
      <p>A tárgyak, képek és mentések szinkronizálásához internetkapcsolat kell.</p>
      <p>Kapcsolódás után töltsd újra az oldalt, és ott folytathatod, ahol abbahagytad.</p>
      <button type="button" onclick="window.location.reload()">Újrapróbálás</button>
    </main>
  </body>
</html>
